# ═══════════════════════════════════════════════════════════════════
# CI — автоматические тесты при Push и Pull Request
# ═══════════════════════════════════════════════════════════════════

name: CI

# Когда запускать
on:
  push:
    branches: [main, feat/setup-postgres]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Тесты бэкенда
  # ─────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      # Поднимаем PostgreSQL для тестов
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db_test
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_pass
        ports:
          - 5432:5432
        # Проверяем, что PostgreSQL готов
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Получаем код
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем Rust
      - name: Install Rust
        uses: dtolnay/rust-action@stable

      # Кэшируем зависимости (ускоряет сборку)
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      # Устанавливаем sqlx-cli для миграций
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      # Применяем миграции
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://dev_user:dev_pass@localhost:5432/auth_db_test
        run: sqlx migrate run

      # Запускаем тесты
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://dev_user:dev_pass@localhost:5432/auth_db_test
          JWT_SECRET: test_secret_for_ci
        run: cargo test --verbose

  # ─────────────────────────────────────────────────────────────────
  # Проверка фронтенда
  # ─────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check || true  # Пока не падаем на ошибках типов

      - name: Lint
        working-directory: ./frontend
        run: npm run lint || true  # Пока не падаем на lint-ошибках