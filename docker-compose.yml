services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # ✅ Правильный формат

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin  # ✅ Добавлен том для pgadmin

# ✅ Корневая секция volumes — МАППИНГ (не список!)
volumes:
  pgdata:  # Том для PostgreSQL
  pgadmin-data:  # Том для pgAdmin